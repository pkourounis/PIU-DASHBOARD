<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PatchitUP · Admin</title>
<style>
  :root{
    --blue-50:#eaf3fc; --blue-400:#4B90D0; --blue-500:#2A7DD1; --blue-600:#2368b4; --blue-700:#1b5391; --blue-950:#0C3155;
    --brand:var(--blue-500); --brand-deep:var(--blue-950);
    --gradient-brand:linear-gradient(158deg,#4B90D0 0%,#1b5391 55%,#0C3155 100%);
    --bg:#eaf1f8; --panel:#fff; --panel-2:#f2f7fc; --ink:#0f2233; --ink-2:#4a5a6a; --ink-3:#7E8488;
    --border:#dae7f2; --border-2:#e9f1f8; --good:#1f9d63; --good-wash:#e6f5ee; --bad:#d6543f; --bad-wash:#fbeae6; --warn:#c98a12; --warn-wash:#fbf1dc;
    --radius:16px; --radius-sm:11px; --radius-pill:999px;
    --shadow:0 1px 2px rgba(12,49,85,.06),0 10px 26px rgba(12,49,85,.10); --shadow-lg:0 2px 6px rgba(12,49,85,.08),0 18px 44px rgba(12,49,85,.16);
    --ring-brand:0 0 0 3px rgba(42,125,209,.4); --ls-wide:.10em;
    --font:"Fira Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --blue-50:#18304a; --brand:#4a97dc; --brand-deep:#bfdcf5;
    --gradient-brand:linear-gradient(158deg,#2f6aa8 0%,#123a63 55%,#0a2947 100%);
    --bg:#0a1622; --panel:#10202f; --panel-2:#16293b; --ink:#e8f0f8; --ink-2:#9fb2c4; --ink-3:#7E8488;
    --border:#23374a; --border-2:#1c2c3d; --good:#35bd80; --good-wash:#12261d; --bad:#f0705c; --bad-wash:#2a1512; --warn:#e6a53a; --warn-wash:#2a2210;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4); --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 20px 48px rgba(0,0,0,.5); --ring-brand:0 0 0 3px rgba(79,151,214,.45);
  }}
  :root[data-theme="dark"]{
    --blue-50:#18304a; --brand:#4a97dc; --brand-deep:#bfdcf5;
    --gradient-brand:linear-gradient(158deg,#2f6aa8 0%,#123a63 55%,#0a2947 100%);
    --bg:#0a1622; --panel:#10202f; --panel-2:#16293b; --ink:#e8f0f8; --ink-2:#9fb2c4; --ink-3:#7E8488;
    --border:#23374a; --border-2:#1c2c3d; --good:#35bd80; --good-wash:#12261d; --bad:#f0705c; --bad-wash:#2a1512; --warn:#e6a53a; --warn-wash:#2a2210;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.4); --shadow-lg:0 2px 6px rgba(0,0,0,.45),0 20px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}

  .topbar{display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 22px;position:sticky;top:0;z-index:20}
  .logo-img{height:40px;width:auto;display:block;flex:none}
  .logo-dark{display:none}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none} :root:not([data-theme="light"]) .logo-dark{display:block}}
  :root[data-theme="light"] .logo-light{display:block} :root[data-theme="light"] .logo-dark{display:none}
  :root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}
  .dept{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:var(--ls-wide);text-transform:uppercase}
  .spacer{flex:1}
  .role-badge{font-size:11px;font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--brand-deep);background:var(--blue-50);border:1px solid var(--border);padding:6px 11px;border-radius:var(--radius-pill)}
  .who{font-size:12.5px;color:var(--ink-2);font-weight:700}
  .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--ink-2);font-size:15px;cursor:pointer;font-family:inherit}
  .iconbtn:hover{color:var(--brand);border-color:var(--brand)}
  a.viewlink{font-size:12.5px;font-weight:800;color:var(--brand);text-decoration:none;border:1px solid var(--border);padding:8px 12px;border-radius:var(--radius-pill)}

  .wrap{display:grid;grid-template-columns:260px 1fr;gap:22px;max-width:1200px;margin:22px auto;padding:0 22px}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}}
  .side{display:flex;flex-direction:column;gap:8px}
  .side h3{font-size:11px;font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--ink-3);margin:6px 4px}
  .locbtn{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .locbtn.on{border-color:var(--brand);box-shadow:var(--ring-brand);color:var(--brand-deep)}
  .locbtn .tag{font-size:10.5px;font-weight:800;color:var(--ink-3)}
  .addbtn{background:var(--gradient-brand);color:#fff;border:0;border-radius:var(--radius-sm);padding:11px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
  .panel h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
  .panel .desc{color:var(--ink-3);font-size:13px;font-weight:600;margin:0 0 16px}
  .tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:var(--radius-pill);cursor:pointer}
  .tabs button.on{background:var(--panel);color:var(--brand-deep);box-shadow:var(--shadow)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:620px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11.5px;font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--ink-3)}
  .field input,.field select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);color:var(--ink)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring-brand)}
  .hint{font-size:11px;color:var(--ink-3);font-weight:600}
  .row-actions{display:flex;gap:10px;align-items:center;margin-top:16px}
  .btn{background:var(--gradient-brand);color:#fff;border:0;border-radius:var(--radius-sm);padding:11px 18px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--border)}
  .btn.danger{background:var(--bad-wash);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
  .btn:disabled{opacity:.6;cursor:default}
  .savemsg{font-size:12.5px;font-weight:700}

  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{font-size:10.5px;font-weight:800;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  table.tbl td{padding:7px 10px;border-bottom:1px solid var(--border-2);vertical-align:middle}
  table.tbl input,table.tbl select{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);color:var(--ink)}
  .tbl-scroll{overflow-x:auto}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:var(--radius-pill);background:var(--panel-2);border:1px solid var(--border);color:var(--ink-2)}
  .chk{width:18px;height:18px}

  /* login overlay */
  .login-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:18px}
  .login-overlay[hidden]{display:none}
  .login-card{width:min(400px,94vw);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px 30px;text-align:center}
  .login-card h1{font-size:20px;margin:12px 0 2px;letter-spacing:-.02em}
  .login-sub{color:var(--ink-3);font-size:13px;font-weight:600;margin:0 0 18px}
  .login-tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px;margin-bottom:14px}
  .login-tabs button{border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 14px;border-radius:var(--radius-pill);cursor:pointer}
  .login-tabs button.on{background:var(--panel);color:var(--brand-deep);box-shadow:var(--shadow)}
  #loginForm{display:flex;flex-direction:column;gap:10px}
  #loginForm input{font-family:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--panel-2);color:var(--ink)}
  .login-btn{background:var(--gradient-brand);color:#fff;border:0;font-weight:800;font-size:14px;padding:12px;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit}
  .login-msg{min-height:18px;font-size:12.5px;font-weight:700;margin-top:10px}
  .empty{color:var(--ink-3);font-size:13.5px;font-weight:600;padding:20px 4px}
</style>

<div class="topbar">
  <img class="logo-img logo-light" src="assets/patchitup-wordmark-color.webp" alt="PatchitUP" />
  <img class="logo-img logo-dark" src="assets/patchitup-wordmark-white.png" alt="PatchitUP" />
  <span class="dept">Admin</span>
  <div class="spacer"></div>
  <span class="role-badge" id="roleBadge" style="display:none"></span>
  <span class="who" id="whoami"></span>
  <a class="viewlink" href="index.html">View dashboard →</a>
  <button class="iconbtn" id="theme" title="Toggle theme">◑</button>
  <button class="iconbtn" id="signout" title="Sign out" style="display:none">⎋</button>
</div>

<div class="wrap" id="wrap" hidden>
  <div class="side" id="side"></div>
  <div class="content" id="content"></div>
</div>

<div class="login-overlay" id="loginOverlay" hidden>
  <div class="login-card">
    <img class="login-logo logo-light" src="assets/patchitup-wordmark-color.webp" alt="PatchitUP" style="height:38px" />
    <img class="login-logo logo-dark" src="assets/patchitup-wordmark-white.png" alt="PatchitUP" style="height:38px" />
    <h1>Admin sign-in</h1>
    <p class="login-sub">Manage locations, goals, and technicians.</p>
    <div class="login-tabs" id="loginTabs">
      <button data-tab="magic">Email link</button>
      <button data-tab="password" class="on">Password</button>
    </div>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email" required />
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" />
      <button type="submit" class="login-btn" id="loginSubmit">Sign in</button>
    </form>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js"></script>
