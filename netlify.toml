# Publishes the PatchitUP location technician dashboard. The build copies the
# front-end (dashboard/technician-dashboard.html) to the publish root as
# index.html, plus the brand assets it references. The former corporate board
# (dashboard/index.html) is kept in-repo for reference but is no longer served.
[build]
  command = "mkdir -p site/assets site/vendor && cp dashboard/technician-dashboard.html site/index.html && cp dashboard/admin.html site/admin.html && cp dashboard/app.js dashboard/admin.js dashboard/supabase-config.js site/ && cp dashboard/assets/* site/assets/ && cp dashboard/vendor/* site/vendor/"
  publish = "site"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Always revalidate the app shell + scripts so a new deploy is picked up on the next normal
# reload — no hard-refresh needed. Without this, browsers cache admin.js/app.js across deploys
# and can run stale code (e.g. an old photo uploader that skips image normalization).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
